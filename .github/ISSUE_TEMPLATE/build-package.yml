name: Build a package for WebAssembly
description: Request an on-demand WebR (wasm) build of a CRAN package.
title: "build: "
labels: ["build-package"]
body:
  - type: markdown
    attributes:
      value: |
        Put ONE CRAN package name in the title after `build:` (e.g. `build: altmeta`)
        and/or in the field below. The workflow skips everything already served by this
        repo, repo.r-wasm.org or jags-wasm, builds only the rest (deps first,
        incrementally, usually a few minutes per package) and reports back here.
        The issue closes itself once the package is live; failures get the log tail
        and the `build-failed` label.

        Note: the `build-package` label is only applied automatically for users with
        triage/write access; otherwise a maintainer must add it to start the build.
  - type: input
    id: packages
    attributes:
      label: Packages
      description: CRAN package name (several may be comma-separated).
      placeholder: "pkgname"
    validations:
      required: true
