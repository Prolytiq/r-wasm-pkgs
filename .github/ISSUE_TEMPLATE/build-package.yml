name: Build a package for WebAssembly
description: Request an on-demand WebR (wasm) build of one or more CRAN packages.
title: "build: "
labels: ["build-package"]
body:
  - type: markdown
    attributes:
      value: |
        Put the CRAN package name(s) in the title after `build:` (e.g. `build: pkgA, pkgB`)
        and/or in the field below. The workflow computes the full recursive dependency
        closure (Depends + Imports + LinkingTo), adds the missing names to `packages`,
        rebuilds the repo and reports back here (typically 25-40 min).

        Note: the `build-package` label is only applied automatically for users with
        triage/write access; otherwise a maintainer must add it to start the build.
  - type: input
    id: packages
    attributes:
      label: Packages
      description: CRAN package names, comma-separated.
      placeholder: "pkgA, pkgB"
    validations:
      required: true
