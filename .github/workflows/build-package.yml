# On-demand WebAssembly package build, requested through a GitHub issue.
#
# Request: open an issue titled `build: pkgA[, pkgB]` (or use the
# "Build a package" issue form) carrying the `build-package` label.
#
# Access gate: only users with triage/write access can apply labels, so only
# they can start a build. An issue from anyone else is ignored until a
# maintainer adds `build-package`.
#
# Security: the `issues` trigger runs with a write-scoped GITHUB_TOKEN. The
# issue title/body are attacker-controlled, so they are NEVER interpolated
# into `run:` scripts with ${{ }} -- they reach the shell only through `env:`
# and every package name is validated against the CRAN name regex before use.
#
# Flow: compute the recursive closure (scripts/closure.R) -> append the
# missing names to `packages` -> commit + push to main -> explicitly
# dispatch deploy.yml (pushes made with GITHUB_TOKEN do not trigger other
# workflows; workflow_dispatch is the documented exception) -> watch that run
# -> verify the package on GitHub Pages -> comment, close / label build-failed.

name: On-demand package build

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write # commit the updated `packages` file to main
  issues: write # comment, label, close
  actions: write # dispatch deploy.yml and read its runs/logs

concurrency:
  group: build-package-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  build:
    # `labeled` with build-package is the normal path. `opened` only matters
    # when the label was present at creation; the dedupe step below skips it
    # when a `labeled` event was also emitted for the same issue.
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'build-package') ||
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'build-package'))
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      EVENT_ACTION: ${{ github.event.action }}
      PAGES_PACKAGES: https://prolytiq.github.io/r-wasm-pkgs/bin/emscripten/contrib/4.6/PACKAGES
    steps:
      - name: Skip duplicate trigger
        id: dedupe
        run: |
          state=$(gh issue view "$ISSUE" --json state -q .state)
          if [ "$state" != "OPEN" ]; then
            echo "Issue is $state; nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT_ACTION" = "opened" ]; then
            n=$(gh api "repos/$GH_REPO/issues/$ISSUE/events" \
                  -q '[.[] | select(.event=="labeled" and .label.name=="build-package")] | length')
            if [ "${n:-0}" -gt 0 ]; then
              echo "A 'labeled' event exists for this issue; that run handles it."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Parse and validate package names
        if: steps.dedupe.outputs.skip == 'false'
        id: parse
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: python3 {0}
        run: |
          import os, re
          title = os.environ.get("ISSUE_TITLE", "")
          body = os.environ.get("ISSUE_BODY", "") or ""
          raw = []
          m = re.match(r"\s*build:\s*(.*)$", title, re.I)
          if m:
              raw.append(m.group(1))
          lines = body.splitlines()
          for i, line in enumerate(lines):
              mm = re.match(r"\s*packages:\s*(.*)$", line, re.I)
              if mm:
                  raw.append(mm.group(1))
              # Issue-form rendering: "### Packages" heading, value on next non-empty line(s)
              if re.match(r"\s*###\s*packages\s*$", line, re.I):
                  for nxt in lines[i + 1:]:
                      if nxt.strip().startswith("###"):
                          break
                      if nxt.strip() and nxt.strip() != "_No response_":
                          raw.append(nxt)
          tokens = [t for r in raw for t in re.split(r"[,\s]+", r) if t]
          name_re = re.compile(r"^[A-Za-z][A-Za-z0-9.]*[A-Za-z0-9]$")
          ok, bad = [], []
          for t in tokens:
              (ok if name_re.match(t) else bad).append(t)
          ok = list(dict.fromkeys(ok))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"pkgs={' '.join(ok)}\n")
              fh.write(f"valid={'true' if ok and not bad else 'false'}\n")
          with open("/tmp/reject.md", "w") as fh:
              if bad:
                  safe = [b.replace("`", "")[:60] for b in bad]
                  fh.write("Rejected: these entries are not valid CRAN package names "
                           "(regex `^[A-Za-z][A-Za-z0-9.]*[A-Za-z0-9]$`):\n\n")
                  fh.write("\n".join(f"- `{s}`" for s in safe) + "\n")
              elif not ok:
                  fh.write("Rejected: no package names found. Use the title "
                           "`build: pkgA, pkgB` or a body line `packages: pkgA, pkgB`.\n")

      - name: Reject invalid request
        if: steps.dedupe.outputs.skip == 'false' && steps.parse.outputs.valid != 'true'
        run: |
          gh issue comment "$ISSUE" --body-file /tmp/reject.md
          exit 1

      - uses: actions/checkout@v4
        if: steps.dedupe.outputs.skip == 'false' && steps.parse.outputs.valid == 'true'
        with:
          ref: main

      - uses: r-lib/actions/setup-r@v2
        if: steps.dedupe.outputs.skip == 'false' && steps.parse.outputs.valid == 'true'
        with:
          use-public-rspm: true

      - name: Compute recursive dependency closure
        if: steps.dedupe.outputs.skip == 'false' && steps.parse.outputs.valid == 'true'
        id: closure
        env:
          PKGS: ${{ steps.parse.outputs.pkgs }}
        run: |
          start=$(date +%s)
          # PKGS contains only regex-validated names; word splitting is intended.
          if ! Rscript scripts/closure.R $PKGS > /tmp/closure.txt 2> /tmp/closure.err; then
            { echo "Dependency closure failed for \`$PKGS\`:"; echo; echo '```'; tail -20 /tmp/closure.err; echo '```'; } > /tmp/c.md
            gh issue comment "$ISSUE" --body-file /tmp/c.md
            exit 1
          fi
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          # Missing = closure members not already listed in `packages` (keep file order, append).
          grep -vxF -f <(sed 's/[[:space:]]*$//' packages | grep -v '^$') /tmp/closure.txt > /tmp/missing.txt || true
          echo "missing=$(wc -l < /tmp/missing.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "closure=$(wc -l < /tmp/closure.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "Closure:"; cat /tmp/closure.txt; echo "Missing:"; cat /tmp/missing.txt

      - name: Nothing to add
        if: steps.closure.outputs.missing == '0'
        env:
          PKGS: ${{ steps.parse.outputs.pkgs }}
        run: |
          { echo "\`$PKGS\` and its full dependency closure ($(wc -l < /tmp/closure.txt) packages) are already listed in \`packages\` -- nothing to build."
            echo; echo "Repo: $PAGES_PACKAGES"; } > /tmp/c.md
          gh issue comment "$ISSUE" --body-file /tmp/c.md
          gh issue close "$ISSUE" --reason completed

      - name: Commit and push to main
        if: steps.closure.outputs.missing != '0' && steps.closure.outputs.missing != ''
        id: commit
        env:
          PKGS: ${{ steps.parse.outputs.pkgs }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Ensure trailing newline before appending.
          [ -n "$(tail -c1 packages)" ] && echo >> packages
          cat /tmp/missing.txt >> packages
          added=$(wc -l < /tmp/missing.txt | tr -d ' ')
          requested_added=$(grep -cxF -f <(tr ' ' '\n' <<< "$PKGS") /tmp/missing.txt || true)
          deps=$(( added - requested_added ))
          list=$(tr ' ' '\n' <<< "$PKGS" | paste -sd, - | sed 's/,/, /g')
          git add packages
          git commit -m "feat: add ${list} (+${deps} deps) — on-demand build #${ISSUE}"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && break
            git pull --rebase origin main
          done
          sha=$(git rev-parse HEAD)
          git ls-remote origin refs/heads/main | grep -q "^$sha" || { echo "push failed"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          { echo "Recursive closure (Depends + Imports + LinkingTo, base packages excluded) for \`$PKGS\`:"
            echo; echo '```'; paste -sd' ' /tmp/closure.txt; echo '```'
            echo "Added to \`packages\` (${added}): \`$(paste -sd' ' /tmp/missing.txt)\`"
            echo; echo "Commit: $sha. Dispatching the deploy workflow (full repo rebuild, typically 25-40 min)..."; } > /tmp/c.md
          gh issue comment "$ISSUE" --body-file /tmp/c.md

      - name: Dispatch deploy.yml and wait
        if: steps.commit.outputs.sha != ''
        id: deploy
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run deploy.yml --ref main
          run_id=""
          for i in $(seq 1 30); do
            sleep 10
            run_id=$(gh run list --workflow deploy.yml --event workflow_dispatch --commit "$SHA" \
                       --json databaseId -q '.[0].databaseId')
            [ -n "$run_id" ] && break
          done
          if [ -z "$run_id" ]; then
            gh issue comment "$ISSUE" --body "Could not find the dispatched deploy run for $SHA."
            gh issue edit "$ISSUE" --add-label build-failed
            exit 1
          fi
          url="https://github.com/$GH_REPO/actions/runs/$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          gh issue comment "$ISSUE" --body "Deploy run started: $url"
          start=$(date +%s)
          if gh run watch "$run_id" --exit-status --interval 60 > /dev/null; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
          fi
          echo "minutes=$(( ($(date +%s) - start) / 60 ))" >> "$GITHUB_OUTPUT"

      - name: Report deploy failure
        if: steps.deploy.outputs.result == 'failure'
        env:
          RUN_ID: ${{ steps.deploy.outputs.run_id }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          { echo "Deploy run **failed**: $URL"; echo; echo "Log tail (failed steps):"; echo
            echo '```'; { gh run view "$RUN_ID" --log-failed | tail -80 | cut -c1-300; } || true; echo '```'; } > /tmp/c.md
          gh issue comment "$ISSUE" --body-file /tmp/c.md
          gh issue edit "$ISSUE" --add-label build-failed
          exit 1

      - name: Verify on GitHub Pages
        if: steps.deploy.outputs.result == 'success'
        env:
          PKGS: ${{ steps.parse.outputs.pkgs }}
          RUN_ID: ${{ steps.deploy.outputs.run_id }}
          URL: ${{ steps.deploy.outputs.url }}
          MINUTES: ${{ steps.deploy.outputs.minutes }}
        run: |
          # Pages is served behind a CDN with a ~10 min cache; poll up to ~15 min.
          found=false
          for i in $(seq 1 30); do
            curl -fsSL "$PAGES_PACKAGES?nocache=$(date +%s)" -o /tmp/PACKAGES || true
            missing_now=""
            for p in $PKGS; do
              grep -qxF "Package: $p" /tmp/PACKAGES || missing_now="$missing_now $p"
            done
            if [ -z "$missing_now" ]; then found=true; break; fi
            echo "Not yet on Pages:$missing_now (attempt $i)"; sleep 30
          done
          if $found; then
            { echo "Build **succeeded** ($URL, ~${MINUTES} min). Verified on $PAGES_PACKAGES:"; echo
              for p in $PKGS; do
                echo '```'; awk -v p="Package: $p" '$0==p{f=1} f&&/^$/{exit} f' /tmp/PACKAGES; echo '```'
              done
              echo; echo "Install in WebR: \`webr::install(\"$(echo $PKGS | cut -d' ' -f1)\", repos = c(\"https://prolytiq.github.io/r-wasm-pkgs/\", \"https://repo.r-wasm.org/\"))\`"
            } > /tmp/c.md
            gh issue comment "$ISSUE" --body-file /tmp/c.md
            gh issue close "$ISSUE" --reason completed
          else
            # Deploy succeeded but the package is absent: its own build most likely failed
            # (the repo build continues past per-package failures). Show related log lines.
            { echo "Deploy run succeeded ($URL) but \`$missing_now\` did not appear in $PAGES_PACKAGES after ~15 min."
              echo "Most likely the package failed to compile for wasm (e.g. needs a system library not in the webr image)."
              echo; echo "Log lines mentioning it:"; echo; echo '```'
              pat=$(echo $missing_now | sed 's/ /|/g')
              { gh run view "$RUN_ID" --log | grep -iE "$pat" | tail -80 | cut -c1-300; } || true
              echo '```'; } > /tmp/c.md
            gh issue comment "$ISSUE" --body-file /tmp/c.md
            gh issue edit "$ISSUE" --add-label build-failed
            exit 1
          fi
