# On-demand WebAssembly package build, requested through a GitHub issue.
#
# Request: open an issue titled `build: pkgname` (or use the "Build a package"
# issue form) carrying the `build-package` label. One package per issue is
# the convention; `build: pkgA, pkgB` also works.
#
# Access gate: only users with triage/write access can apply labels, so only
# they can start a build. An issue from anyone else is ignored until a
# maintainer adds `build-package`.
#
# Security: the `issues` trigger runs with a write-scoped GITHUB_TOKEN. The
# issue title/body are attacker-controlled, so they are NEVER interpolated
# into `run:` scripts with ${{ }} -- they reach the shell only through `env:`
# and every package name is validated against the CRAN name regex before use.
#
# Flow: parse + validate -> build closure (scripts/closure.R --to-build:
# Depends+Imports+LinkingTo minus base minus anything already served by this
# repo, repo.r-wasm.org or jags-wasm) -> nothing to build: comment where it
# is available and close -> otherwise build-batch.yml builds only those
# packages (deps first), commits them to the `site` store and deploys Pages
# -> comment per-package results -> verify the requested packages in the live
# PACKAGES index -> close, or label `build-failed` and leave open.

name: On-demand package build

on:
  issues:
    types: [opened, labeled]

permissions: {}

concurrency:
  group: build-package-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  request:
    # `labeled` with build-package is the normal path. `opened` only matters
    # when the label was present at creation; the dedupe step below skips it
    # when a `labeled` event was also emitted for the same issue.
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'build-package') ||
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'build-package'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    outputs:
      status: ${{ steps.closure.outputs.status }}
      pkgs: ${{ steps.parse.outputs.pkgs }}
      build: ${{ steps.closure.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      EVENT_ACTION: ${{ github.event.action }}
    steps:
      - name: Skip duplicate trigger
        id: dedupe
        run: |
          state=$(gh issue view "$ISSUE" --json state -q .state)
          if [ "$state" != "OPEN" ]; then
            echo "Issue is $state; nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT_ACTION" = "opened" ]; then
            n=$(gh api "repos/$GH_REPO/issues/$ISSUE/events" \
                  -q '[.[] | select(.event=="labeled" and .label.name=="build-package")] | length')
            if [ "${n:-0}" -gt 0 ]; then
              echo "A 'labeled' event exists for this issue; that run handles it."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Parse and validate package names
        if: steps.dedupe.outputs.skip == 'false'
        id: parse
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: python3 {0}
        run: |
          import os, re
          title = os.environ.get("ISSUE_TITLE", "")
          body = os.environ.get("ISSUE_BODY", "") or ""
          raw = []
          m = re.match(r"\s*build:\s*(.*)$", title, re.I)
          if m:
              raw.append(m.group(1))
          lines = body.splitlines()
          for i, line in enumerate(lines):
              mm = re.match(r"\s*packages:\s*(.*)$", line, re.I)
              if mm:
                  raw.append(mm.group(1))
              # Issue-form rendering: "### Packages" heading, value on next non-empty line(s)
              if re.match(r"\s*###\s*packages\s*$", line, re.I):
                  for nxt in lines[i + 1:]:
                      if nxt.strip().startswith("###"):
                          break
                      if nxt.strip() and nxt.strip() != "_No response_":
                          raw.append(nxt)
          tokens = [t for r in raw for t in re.split(r"[,\s]+", r) if t]
          name_re = re.compile(r"^[A-Za-z][A-Za-z0-9.]*[A-Za-z0-9]$")
          ok, bad = [], []
          for t in tokens:
              (ok if name_re.match(t) else bad).append(t)
          ok = list(dict.fromkeys(ok))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"pkgs={' '.join(ok)}\n")
              fh.write(f"valid={'true' if ok and not bad else 'false'}\n")
          with open("/tmp/reject.md", "w") as fh:
              if bad:
                  safe = [b.replace("`", "")[:60] for b in bad]
                  fh.write("Rejected: these entries are not valid CRAN package names "
                           "(regex `^[A-Za-z][A-Za-z0-9.]*[A-Za-z0-9]$`):\n\n")
                  fh.write("\n".join(f"- `{s}`" for s in safe) + "\n")
              elif not ok:
                  fh.write("Rejected: no package names found. Use the title "
                           "`build: pkgname` or a body line `packages: pkgA, pkgB`.\n")

      - name: Reject invalid request
        if: steps.dedupe.outputs.skip == 'false' && steps.parse.outputs.valid != 'true'
        run: |
          gh issue comment "$ISSUE" --body-file /tmp/reject.md
          exit 1

      - uses: actions/checkout@v4
        if: steps.dedupe.outputs.skip == 'false' && steps.parse.outputs.valid == 'true'
        with:
          ref: main

      - uses: r-lib/actions/setup-r@v2
        if: steps.dedupe.outputs.skip == 'false' && steps.parse.outputs.valid == 'true'
        with:
          use-public-rspm: true

      - name: Compute what must be built
        if: steps.dedupe.outputs.skip == 'false' && steps.parse.outputs.valid == 'true'
        id: closure
        env:
          PKGS: ${{ steps.parse.outputs.pkgs }}
        run: |
          # PKGS contains only regex-validated names; word splitting is intended.
          if ! Rscript scripts/closure.R --to-build --report /tmp/report.tsv $PKGS > /tmp/build.txt 2> /tmp/closure.err; then
            { echo "Dependency closure failed for \`$PKGS\`:"; echo; echo '```'; tail -20 /tmp/closure.err; echo '```'; } > /tmp/c.md
            gh issue comment "$ISSUE" --body-file /tmp/c.md
            gh issue edit "$ISSUE" --add-label build-failed
            exit 1
          fi
          cat /tmp/report.tsv
          echo "build=$(paste -sd' ' /tmp/build.txt)" >> "$GITHUB_OUTPUT"
          # Non-numeric status on purpose: Actions expressions coerce a skipped step's
          # null output to 0, so `== '0'` would match when this step never ran.
          if [ -s /tmp/build.txt ]; then echo "status=build"; else echo "status=available"; fi >> "$GITHUB_OUTPUT"
          {
            echo "Requested: \`$PKGS\`"
            echo
            for p in $PKGS; do
              src=$(awk -F'\t' -v p="$p" '$1==p{print $2}' /tmp/report.tsv)
              case $src in
                build) echo "- \`$p\`: not in any wasm repo yet -> **will be built here**" ;;
                prolytiq) echo "- \`$p\`: already available from https://prolytiq.github.io/r-wasm-pkgs/" ;;
                r-wasm) echo "- \`$p\`: already available from https://repo.r-wasm.org/" ;;
                jags-wasm) echo "- \`$p\`: already available from https://prolytiq.github.io/jags-wasm/" ;;
              esac
            done
            if [ -s /tmp/build.txt ]; then
              echo
              echo "To build (deps first, $(wc -l < /tmp/build.txt | tr -d ' ')): \`$(paste -sd' ' /tmp/build.txt)\`"
              echo "Closure members already served elsewhere: $(awk -F'\t' '$2!="build"' /tmp/report.tsv | wc -l | tr -d ' ') (prolytiq $(grep -c $'\tprolytiq$' /tmp/report.tsv || true), r-wasm $(grep -c $'\tr-wasm$' /tmp/report.tsv || true), jags-wasm $(grep -c $'\tjags-wasm$' /tmp/report.tsv || true))."
              echo
              echo "Starting the incremental build: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
            fi
          } > /tmp/c.md
          gh issue comment "$ISSUE" --body-file /tmp/c.md

      - name: Nothing to build
        if: steps.closure.outputs.status == 'available'
        run: |
          gh issue comment "$ISSUE" --body "Nothing to build: everything requested is already installable from the repos the app uses (see above). Closing."
          gh issue close "$ISSUE" --reason completed

  build:
    needs: request
    if: needs.request.outputs.status == 'build'
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/build-batch.yml
    with:
      packages: ${{ needs.request.outputs.build }}
      time-cap-minutes: 150
      request-id: issue-${{ github.event.issue.number }}

  report:
    needs: [request, build]
    if: always() && needs.request.outputs.status == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      PKGS: ${{ needs.request.outputs.pkgs }}
      BUILD: ${{ needs.request.outputs.build }}
      OK: ${{ needs.build.outputs.ok }}
      BUILD_RESULT: ${{ needs.build.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PAGES_PACKAGES: https://prolytiq.github.io/r-wasm-pkgs/bin/emscripten/contrib/4.6/PACKAGES
    steps:
      - uses: actions/download-artifact@v4
        id: dl
        continue-on-error: true
        with:
          name: build-results
          path: results

      - name: Comment per-package results
        run: |
          {
            echo "Build run: $RUN_URL (builder job: **$BUILD_RESULT**)"
            echo
            if [ -f results/summary.md ]; then
              cat results/summary.md
              for f in $(awk -F'\t' 'NR>1 && $2=="failed"{print $1}' results/results.tsv); do
                [[ $f =~ ^[A-Za-z][A-Za-z0-9.]*[A-Za-z0-9]$ ]] || continue
                echo; echo "<details><summary><code>$f</code> log tail (last 40 lines)</summary>"; echo; echo '```'
                tail -n 40 "results/logs/$f.log" | cut -c1-300 | sed 's/```/` ` `/g'
                echo '```'; echo "</details>"
              done
            else
              echo "No results artifact: the builder did not get to report (see the run log)."
            fi
          } > /tmp/c.md
          gh issue comment "$ISSUE" --body-file /tmp/c.md

      - name: Verify on GitHub Pages and close
        run: |
          # Only the requested packages that had to be built here are checked;
          # the others were reported as available elsewhere.
          want=""
          for p in $PKGS; do
            case " $BUILD " in *" $p "*) want="$want $p" ;; esac
          done
          notok=""
          for p in $want; do case " $OK " in *" $p "*) ;; *) notok="$notok $p" ;; esac; done
          if [ -n "$notok" ]; then
            gh issue comment "$ISSUE" --body "Build **failed** for:\`$notok\`. Labelled \`build-failed\`; remove and re-add \`build-package\` to retry after a fix."
            gh issue edit "$ISSUE" --add-label build-failed
            exit 1
          fi
          # Pages is served behind a CDN (~10 min cache); poll up to ~20 min.
          found=false
          for i in $(seq 1 40); do
            if curl -fsSL "$PAGES_PACKAGES?nocache=$(date +%s)" -o /tmp/PACKAGES; then
              missing_now=""
              for p in $want; do grep -qxF "Package: $p" /tmp/PACKAGES || missing_now="$missing_now $p"; done
              if [ -z "$missing_now" ]; then found=true; break; fi
              echo "Not yet on Pages:$missing_now (attempt $i)"
            fi
            sleep 30
          done
          if ! $found; then
            gh issue comment "$ISSUE" --body "Built, but \`$missing_now\` did not appear in $PAGES_PACKAGES after ~20 min (deploy problem?). Labelled \`build-failed\`."
            gh issue edit "$ISSUE" --add-label build-failed
            exit 1
          fi
          first=$(echo $want | cut -d' ' -f1)
          {
            echo "Verified on $PAGES_PACKAGES ($(grep -c '^Package:' /tmp/PACKAGES) packages in the index):"; echo
            for p in $want; do
              echo '```'; awk -v p="Package: $p" '$0==p{f=1} f&&/^$/{exit} f' /tmp/PACKAGES; echo '```'
            done
            echo
            echo "Install in WebR (deps such as rjags come from jags-wasm):"
            echo '```r'
            echo "webr::install(\"$first\", repos = c(\"https://prolytiq.github.io/r-wasm-pkgs/\", \"https://prolytiq.github.io/jags-wasm/\", \"https://repo.r-wasm.org/\"))"
            echo '```'
          } > /tmp/c.md
          gh issue comment "$ISSUE" --body-file /tmp/c.md
          gh issue edit "$ISSUE" --remove-label build-failed 2>/dev/null || true
          gh issue close "$ISSUE" --reason completed
